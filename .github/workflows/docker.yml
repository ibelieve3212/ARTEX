name: docker

# main 分支推送与手动触发时构建多架构镜像 → 推到 GitHub 容器仓库（GHCR）。
# tag（v*）触发的发布镜像由 release.yml 的 docker job 负责，两者互不重叠。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true # 连续推送时取消上一次未跑完的构建，省 Actions 额度

permissions:
  contents: read
  packages: write # 推 GHCR 所需；用内置 GITHUB_TOKEN，无需配置任何仓库 secret

env:
  # GHCR 的镜像名必须全小写（仓库名 ARTEX 是大写，直接用 github.repository 会报
  # "repository name must be lowercase"），所以这里写死小写名而不是拼仓库名。
  IMAGE: ghcr.io/ibelieve3212/artex

jobs:
  # ① 前端静态导出（一次），产物给两个架构的交叉编译复用
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 让后面的 git describe 能读到 tag，版本号才对得上
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out

  # ② 只交叉编译 Linux 两个架构（纯 Go + 预导出前端，不需要 QEMU）
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: 编译内嵌前端的单二进制
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # 不启用 UPX：自解压 ELF 在部分内核/虚拟化/安全策略下会崩，
          # Release 那边也是同样取舍，镜像里优先保证可移植性。
          ARTEX_COMPRESS: "0"
        run: ./build.sh --target "${ARTEX_TARGET_OS}/${ARTEX_TARGET_ARCH}"
      - name: 冒烟测试（仅 amd64）
        if: matrix.goarch == 'amd64'
        run: dist/artex-linux-amd64/artex -h
      # 单独上传二进制，供 docker job 复用（镜像里不再重编前端 + Go）
      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/artex-linux-${{ matrix.goarch }}/artex

  # ③ 多架构镜像 → 推 GHCR
  # 镜像里只装工具 + 放预编译二进制，所以 arm64 只有 apt/playwright 那层要 QEMU 模拟。
  docker:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-amd64
          path: dist/amd64
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-arm64
          path: dist/arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 版本号与 build.sh 的取法保持一致（去 v 前缀），打一个可追溯的版本标签
      - name: 解析版本号
        id: ver
        run: echo "version=$(git describe --tags --always | sed 's/^v//')" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.ver.outputs.version }}
            type=sha,format=short,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max